plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.version}+${project.minecraft_version}"

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Lyrics engine and now-playing bridge are shared with the 1.21.x builds.
sourceSets {
	main {
		java { srcDirs = ['src/main/java', 'shared/java'] }
		resources { srcDirs = ['src/main/resources', 'shared/resources'] }
	}
}

processResources {
	def props = [version: project.version, minecraft_version: project.minecraft_version]
	inputs.properties props
	filesMatching("fabric.mod.json") { expand props }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// `./gradlew runClient -PlyricsTest` turns the sky lyrics on in the LyricsTest world, so they
// can be checked without a music player. Add `-PnowPlaying=<file>` to read a fixed now-playing
// JSON instead of the Windows media session (used by _scratch/nowplaying-fixed.js).
loom {
	runs {
		client {
			if (project.hasProperty('lyricsTest')) {
				vmArg '-Dswiftclient.debug=lyrics'
				programArg '--quickPlaySingleplayer'
				programArg 'LyricsTest'
			}
			if (project.hasProperty('nowPlaying')) {
				vmArg "-Dswiftclient.nowPlayingPath=${project.property('nowPlaying')}"
				vmArg '-Dswiftclient.noMediaBridge=true'
			}
		}
	}
}

// Copies the built jar to dist/ and records it in dist/index.json, which the launcher
// reads to pick the SwiftClient mod for each Minecraft version.
tasks.register('dist') {
	dependsOn 'build'
	doLast {
		def distDir = file('dist')
		distDir.mkdirs()
		def jar = tasks.jar.archiveFile.get().asFile
		copy { from jar; into distDir }
		def indexFile = new File(distDir, 'index.json')
		def index = indexFile.exists() ? new groovy.json.JsonSlurper().parse(indexFile) : [:]
		index[project.minecraft_version] = jar.name
		indexFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(index))
	}
}
